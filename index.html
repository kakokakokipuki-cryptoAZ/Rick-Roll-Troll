<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>おめでとう！</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; color: #f00; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999; cursor: pointer;
        }
        .haha-text { font-size: 25vw; font-weight: 900; }
        #video-container { width: 100%; height: 100%; display: none; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div id="overlay" onclick="startFullScreen()">
        <p class="haha-text">HAHA</p>
    </div>

    <div id="video-container">
        <iframe id="player" src="" allow="autoplay; fullscreen" allowfullscreen></iframe>
    </div>

    <script>
        function startFullScreen() {
            const videoID = 'dQw4w9WgXcQ'; // 💡ここを好きなIDに！
            const container = document.getElementById('video-container');
            const iframe = document.getElementById('player');
            const overlay = document.getElementById('overlay');

            // URLをセット
            iframe.src = "https://www.youtube.com" + videoID + "?autoplay=1&rel=0";
            
            overlay.style.display = 'none';
            container.style.display = 'block';

            // 💡 フルスクリーン化の処理
            const elem = document.documentElement; // 画面全体
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) { /* Safari / Vivaldi Mac */
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) { /* IE11 */
                elem.msRequestFullscreen();
            }
        }
    </script>
</body>
</html>
