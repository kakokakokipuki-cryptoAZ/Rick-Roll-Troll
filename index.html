<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>おめでとう！</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); color: #ff0000; /* 赤色 */
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10; cursor: pointer;
        }
        /* でっかいHAHAのスタイル */
        .haha-text {
            font-size: 150px; /* 超でかい */
            font-weight: black;
            margin: 0;
            line-height: 1;
        }
        .instruction { color: white; font-size: 20px; margin-top: 20px; }
        .video-container { position: relative; width: 100%; height: 100vh; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <!-- タップ画面（でっかいHAHA） -->
    <div id="overlay" onclick="startVideo()">
        <p class="haha-text">HAHA</p>
        <p class="instruction">タップして再生</p>
    </div>

    <div class="video-container">
        <div id="player"></div>
    </div>

    <script>
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%', width: '100%',
                videoId: 'dQw4w9WgXcQ', // ←ここにYouTubeの11桁のIDを入れて！
                playerVars: { 'playsinline': 1, 'autoplay': 0, 'controls': 1 },
            });
        }

        function startVideo() {
            player.playVideo();
            document.getElementById('overlay').style.display = 'none';
        }
    </script>
</body>
</html>
