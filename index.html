<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>おめでとう！</title>
    <style>
        /* 画面全体のスタイル */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
        
        /* 最初に見えるHAHA画面 */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; color: #f00; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999; cursor: pointer;
        }
        .haha-text { font-size: 25vw; font-weight: 900; margin: 0; }
        .instruction { color: #fff; font-size: 20px; margin-top: 20px; }

        /* 動画を入れる箱 */
        #video-container { width: 100%; height: 100%; display: none; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <!-- ステップ1: HAHAをタップさせる -->
    <div id="overlay" onclick="launchVideo()">
        <p class="haha-text">HAHA</p>
        <p class="instruction">CLICK TO START</p>
    </div>

    <!-- ステップ2: 動画が表示される場所 -->
    <div id="video-container">
        <iframe id="player" src="" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    </div>

    <script>
        function launchVideo() {
            const iframe = document.getElementById('player');
            const container = document.getElementById('video-container');
            const overlay = document.getElementById('overlay');

            // 💡 Error 153対策: ?autoplay=1 に加え、ミュート設定 &mute=1 を追加
            // これでブラウザの自動再生ブロックを突破します
            const videoID = "xvFZjo5PgG0";
            iframe.src = "https://www.youtube.com" + videoID + "?autoplay=1&mute=1&rel=0&modestbranding=1";
            
            // 画面を切り替え
            overlay.style.display = 'none';
            container.style.display = 'block';

            // 💡 フルスクリーンを強制実行
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) { /* Mac Vivaldi / Safari 用 */
                elem.webkitRequestFullscreen();
            }
        }
    </script>
</body>
</html>
