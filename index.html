<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise!</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: black; cursor: pointer; }
        video { width: 100vw; height: 100vh; object-fit: cover; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: white; font-family: sans-serif; z-index: 10; }
    </style>
</head>
<body>

    <!-- クリックを促す透明な壁 -->
    <div id="overlay">画面をタップして開始</div>

    <video id="rick" playsinline>
        <source src="https://shattereddisk.github.io" type="video/mp4">
    </video>

    <script>
        const video = document.getElementById('rick');
        const overlay = document.getElementById('overlay');

        // 画面のどこをクリックしても再生開始＋フルスクリーン
        document.body.addEventListener('click', function() {
            video.play();
            overlay.style.display = 'none'; // テキストを消す
            
            // 可能ならフルスクリーンにする（いたずら効果アップ）
            if (video.requestFullscreen) { video.requestFullscreen(); }
            else if (video.webkitRequestFullscreen) { video.webkitRequestFullscreen(); }
        });
    </script>
</body>
</html>
