<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>おめでとう！</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); color: white;
            display: flex; justify-content: center; align-items: center;
            font-size: 24px; cursor: pointer; z-index: 10;
        }
    </style>
</head>
<body>

    <!-- 画面をタップさせるためのオーバーレイ -->
    <div id="overlay" onclick="startVideo()">画面をタップして再生！</div>

    <div class="video-container">
        <!-- 「 여기에動画のIDを入れる 」を実際のIDに変更してください -->
        <div id="player"></div>
    </div>

    <script>
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                videoId: 'dQw4w9WgXcQ', // 例: dQw4w9WgXcQ
                playerVars: { 'playsinline': 1, 'autoplay': 0, 'controls': 1 },
            });
        }

        function startVideo() {
            player.playVideo();
            document.getElementById('overlay').style.display = 'none';
        }
    </script>
</body>
</html>
