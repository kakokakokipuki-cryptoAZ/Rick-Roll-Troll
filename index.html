<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>おめでとう！</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        /* 初期画面：でっかいHAHA */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; color: #ff0000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; cursor: pointer;
        }
        .haha-text { font-size: 15vw; font-weight: 900; margin: 0; }
        .instruction { color: white; font-size: 20px; margin-top: 20px; }
        /* 動画エリア */
        #video-wrapper { width: 100%; height: 100vh; display: none; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div id="overlay" onclick="goVideo()">
        <p class="haha-text">HAHA</p>
        <p class="instruction">CLICK TO PLAY</p>
    </div>

    <div id="video-wrapper">
        <!-- 💡 '動画のID' をあなたの動画IDに書き換えてください -->
        <iframe id="yt-player" src="" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    </div>

    <script>
        function goVideo() {
            const videoID = 'dQw4w9WgXcQ'; // ← ここを書き換える！
            const iframe = document.getElementById('yt-player');
            const wrapper = document.getElementById('video-wrapper');
            const overlay = document.getElementById('overlay');

            // タップされた瞬間にsrcをセットして強制再生
            iframe.src = "https://www.youtube.com" + videoID + "?autoplay=1&rel=0";
            
            overlay.style.display = 'none';
            wrapper.style.display = 'block';
        }
    </script>
</body>
</html>
