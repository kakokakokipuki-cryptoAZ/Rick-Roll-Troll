<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>おめでとう！</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; color: #f00; display: flex; justify-content: center; align-items: center;
            z-index: 9999; cursor: pointer;
        }
        .haha-text { font-size: 25vw; font-weight: 900; margin: 0; }
        #video-container { width: 100%; height: 100%; display: none; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div id="overlay" onclick="start()">
        <p class="haha-text">HAHA</p>
    </div>

    <div id="video-container">
        <iframe id="player" src="" allow="autoplay; fullscreen" allowfullscreen></iframe>
    </div>

    <script>
        function start() {
            const iframe = document.getElementById('player');
            const container = document.getElementById('video-container');
            const overlay = document.getElementById('overlay');

            // 💡 ここに embed/xvFZjo5PgG0 を入れました！
            iframe.src = "https://www.youtube.com/embed/xvFZjo5PgG0?autoplay=1";
            
            overlay.style.display = 'none';
            container.style.display = 'block';

            const elem = document.documentElement;
            if (elem.requestFullscreen) { elem.requestFullscreen(); }
            else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); }
        }
    </script>
</body>
</html>
