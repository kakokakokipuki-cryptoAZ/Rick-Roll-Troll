<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>おめでとう！</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        /* タップ画面 */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); color: #ff0000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; /* 一番手前に持ってくる */
            cursor: pointer;
        }
        .haha-text { font-size: 150px; font-weight: bold; margin: 0; }
        .instruction { color: white; font-size: 20px; margin-top: 20px; }
        #player-container { width: 100%; height: 100vh; }
    </style>
</head>
<body>

    <div id="overlay">
        <p class="haha-text">HAHA</p>
        <p class="instruction">ここをタップして再生！</p>
    </div>

    <div id="player-container">
        <div id="player"></div>
    </div>

    <script>
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%', width: '100%',
                videoId: 'dQw4w9WgXcQ', // ←ここをあなたの動画IDに変えてね！
                playerVars: { 'playsinline': 1, 'controls': 1 },
                events: { 'onReady': onPlayerReady }
            });
        }

        function onPlayerReady(event) {
            // オーバーレイをクリックした時の動作
            document.getElementById('overlay').addEventListener('click', function() {
                this.style.display = 'none'; // 黒い画面を消す
                player.playVideo();         // 動画を再生する
            });
        }
    </script>
</body>
</html>
