<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>動画再生ページ</title>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #000; color: #fff; font-family: sans-serif; }
        #start-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.8); cursor: pointer; z-index: 10; }
        video { max-width: 100%; max-height: 100%; }
    </style>
</head>
<body>

    <!-- 画面全体を覆うタップエリア -->
    <div id="start-screen">
        <h1>画面をタップして開始</h1>
    </div>

    <!-- 動画本体（playsinlineがないとiPhoneで再生されません） -->
    <video id="myVideo" playsinline>
        <source src="video.mp4" type="video/mp4">
        お使いのブラウザは動画再生に対応していません。
    </video>

    <script>
        const startScreen = document.getElementById('start-screen');
        const video = document.getElementById('myVideo');

        startScreen.addEventListener('click', () => {
            // 動画を再生
            video.play().then(() => {
                // 再生が成功したらタップ画面を消す
                startScreen.style.display = 'none';
            }).catch(error => {
                console.error("再生に失敗しました:", error);
                alert("再生に失敗しました。ファイル名が正しいか確認してください。");
            });
        });
    </script>

</body>
</html>
