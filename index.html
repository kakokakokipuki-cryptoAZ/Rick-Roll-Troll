<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>おめでとう！</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; color: #ff0000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; cursor: pointer;
        }
        .haha-text { font-size: 15vw; font-weight: 900; margin: 0; }
        .instruction { color: white; font-size: 20px; margin-top: 20px; }
        #video-wrapper { width: 100%; height: 100vh; display: none; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div id="overlay" onclick="goVideo()">
        <p class="haha-text">HAHA</p>
        <p class="instruction">CLICK TO PLAY</p>
    </div>

    <div id="video-wrapper">
        <!-- 💡 srcは空のままでOK -->
        <iframe id="yt-player" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <script>
        function goVideo() {
            const iframe = document.getElementById('yt-player');
            const wrapper = document.getElementById('video-wrapper');
            const overlay = document.getElementById('overlay');

            // 💡 スラッシュなどを確実に含めた「完成済みURL」を直接代入します
            // もし別の動画にしたいなら、dQw4w9WgXcQ の部分だけ書き換えてください
            const targetURL = "https://www.youtube.com/watch?v=xvFZjo5PgG0";

            iframe.src = targetURL;
            overlay.style.display = 'none';
            wrapper.style.display = 'block';
        }
    </script>
</body>
</html>
